- hosts: localhost

  vars_files:
    - default.config.yml

  roles:
    - role: elliotweiser.osx-command-line-tools
    - role: geerlingguy.mac.homebrew
      # Taps are declared in the Brewfile. homebrew/core is API-backed on
      # modern Homebrew and tapping it forces a full clone, while
      # homebrew/bundle and homebrew/services are now built-in commands.
      homebrew_taps: []
      homebrew_brewfile_dir: .
      # Install missing Brewfile entries only; never upgrade outdated ones.
      # The role runs `brew bundle` without a TTY, so any upgrade that needs
      # sudo (mas apps, some casks) fails even with --ask-become-pass.
      # Upgrade interactively instead: `brew bundle upgrade` or `brew upgrade`.
      environment:
        HOMEBREW_BUNDLE_NO_UPGRADE: "1"
      tags: ['homebrew']

  tasks:
    - import_tasks: ./tasks/ssh.yml
      tags: ['ssh']

    # mise must run before neovim and ruby - both shell out to `mise exec`.
    - import_tasks: ./tasks/mise.yml
      tags: ['mise']

    - import_tasks: ./tasks/neovim.yml
      tags: ["neovim"]

    - import_tasks: ./tasks/dotfiles.yml
      tags: ["dotfiles"]

    # tinty reads its config from the stowed dotfiles.
    - import_tasks: ./tasks/tinty.yml
      tags: ['tinty']

    - import_tasks: ./tasks/ruby.yml
      tags: ['ruby']

    - import_tasks: ./tasks/llm.yml
      tags: ['llm']

    - import_tasks: ./tasks/osx.yml
      tags: ["osx"]
