---
source_key: "./.ssh/id_rsa"
ssh_config: "./.ssh/config"
dest_key: "{{ lookup('env', 'HOME') }}/.ssh/id_rsa"

# Apple Silicon Homebrew prefix. Tasks call brew-installed binaries by absolute
# path: Ansible's command module runs without the shell PATH set up by .zshrc.
homebrew_brew_bin_path: /opt/homebrew/bin

# --- mise --------------------------------------------------------------------
# Single source of truth for language runtimes and portable dev CLIs.
# Rendered into ~/.config/mise/config.toml by tasks/mise.yml.
#
# Anything listed here must NOT also appear in the Brewfile, or Homebrew's
# /opt/homebrew/bin will shadow the mise copy on PATH.
mise_global_tools:
  # Languages
  go: "latest"
  java: "temurin-17"
  node: "lts"
  python: "latest"
  ruby: "latest"
  rust: "latest"
  yarn: "1" # stay on the Yarn 1.x classic line
  # Portable dev CLIs
  golangci-lint: "latest"
  goreleaser: "latest"
  shellcheck: "latest"
  terraform: "latest"
  tflint: "latest"
  # Buildkite-only tools (kubectl, helm, cilium-cli, overmind, k9s, buf,
  # lefthook, ...) come from ~/code/BK/buildkite/Brewfile and mise.toml.
  # Personal agent tooling (npm packages managed by mise, so they survive
  # node version changes)
  "npm:@earendil-works/pi-coding-agent": "latest"
  "npm:oh-my-openagent": "latest"
  # Python CLIs, each in its own uv-managed environment. `with` adds plugins
  # to the tool's environment, so they survive upgrades.
  "pypi:llm":
    version: "latest"
    with: ["llm-anthropic"]

# How many of the newest Ruby minor series (e.g. 4.0 and 3.4) to install and
# provision gems into, alongside the global `ruby` pin above. The series are
# resolved from `mise ls-remote ruby` on each run (see tasks/mise.yml), so a
# new Ruby release is picked up without editing this file.
mise_ruby_series_count: 2

ruby_gems:
  - bundle-audit
  - timetrap
  - rubocop
  - rubocop-rails
  - rubocop-rspec
