---
- name: Install node tooling used by neovim and its LSP plugins
  ansible.builtin.command:
    cmd: >-
      {{ homebrew_brew_bin_path }}/mise exec node --
      npm install -g {{ neovim_npm_packages | join(' ') }}
  register: neovim_npm
  changed_when: neovim_npm.stdout is search('(added|changed|removed) \d+ package')

- name: Install python support for neovim
  ansible.builtin.command:
    cmd: >-
      {{ homebrew_brew_bin_path }}/mise exec python --
      python -m pip install --upgrade pynvim
  register: neovim_pynvim
  changed_when: "'Successfully installed' in neovim_pynvim.stdout"
