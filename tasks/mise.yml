---
# mise owns language runtimes and portable dev CLIs; Homebrew owns everything
# else. mise itself comes from Homebrew because it is the bootstrap.
#
# Every command here uses an absolute path: Ansible's shell/command modules run
# a non-interactive /bin/sh where neither Homebrew nor mise is on PATH, and
# `mise activate` is a shell prompt hook that never fires in that context.

- name: Ensure mise config directory exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.config/mise"
    state: directory
    mode: "0755"

# Resolve the newest `mise_ruby_series_count` Ruby minor series (e.g. ["3.4", "4.0"])
# from mise's remote version list. Tagged `ruby` too, because tasks/ruby.yml
# loops over the result and must work when run with `--tags ruby` alone.
- name: List available ruby versions
  ansible.builtin.command:
    cmd: "{{ homebrew_brew_bin_path }}/mise ls-remote ruby"
  register: mise_ruby_remote
  changed_when: false
  check_mode: false
  tags: ['ruby']

- name: Pick the latest ruby minor series
  ansible.builtin.set_fact:
    mise_ruby_versions: >-
      {{ (mise_ruby_remote.stdout_lines
          | select('match', '^[0-9]+[.][0-9]+[.][0-9]+$')
          | map('regex_search', '^[0-9]+[.][0-9]+')
          | unique
          | community.general.version_sort)[-mise_ruby_series_count:] }}
  tags: ['ruby']

- name: Check enough ruby series were found
  ansible.builtin.assert:
    that: mise_ruby_versions | length == mise_ruby_series_count
    fail_msg: "Expected {{ mise_ruby_series_count }} ruby series from `mise ls-remote ruby`, got {{ mise_ruby_versions }}"
    quiet: true
  tags: ['ruby']

# The Ruby series are written into the global config as extra `ruby` versions
# (mise's first listed version stays the default), so `mise install` installs
# them and `mise prune` keeps them.
- name: Write global mise tool config
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/mise-config.toml.j2"
    dest: "{{ lookup('env', 'HOME') }}/.config/mise/config.toml"
    mode: "0644"
  vars:
    mise_rendered_tools: >-
      {{ mise_global_tools | combine({'ruby': [mise_global_tools.ruby] + mise_ruby_versions}) }}

# mise reports progress on stderr only; a run with nothing to do ends with
# "installed 0 tools". Homebrew's bin is on PATH so the pypi backend can find uv.
- name: Install globally pinned mise tools
  ansible.builtin.command:
    cmd: "{{ homebrew_brew_bin_path }}/mise install --yes"
  environment:
    PATH: "{{ homebrew_brew_bin_path }}:{{ ansible_facts.env.PATH }}"
  register: mise_install
  changed_when: mise_install.stderr is not search('installed 0 tools')
