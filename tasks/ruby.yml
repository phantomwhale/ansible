---
# Ruby versions themselves are installed by tasks/mise.yml. This only layers
# the shared gem tooling into each of them.
- name: Install ruby gem tools into each mise ruby
  ansible.builtin.command:
    cmd: >-
      {{ homebrew_brew_bin_path }}/mise exec ruby@{{ item }} --
      gem install --no-document {{ ruby_gems | join(' ') }}
  loop: "{{ mise_ruby_versions }}"
  register: ruby_gem_install
  changed_when: "'Successfully installed' in ruby_gem_install.stdout"
